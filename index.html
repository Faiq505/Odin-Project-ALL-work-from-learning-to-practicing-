<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <main>
        <div class="calculator">
            <div class="result"><span class="output"></span></div>
            <div class="btns">
                <div class="numberbtn">
                    <button class="no-btns">9</button>
                    <button class="no-btns">8</button>
                    <button class="no-btns">7</button>
                    <button class="no-btns">6</button>
                    <button class="no-btns">5</button>
                    <button class="no-btns">4</button>
                    <button class="no-btns">3</button>
                    <button class="no-btns">2</button>
                    <button class="no-btns">1</button>
                    <button class="no-btns">0</button>
                    <button class="no-btns" id=".">.</button>
                    <button class="no-btns" id="clear">C</button>
                </div>
                <div class="operationbtns">
                    <button class="opt-btns">+</button>
                    <button class="opt-btns">-</button>
                    <button class="opt-btns">/</button>
                    <button class="opt-btns">X</button>
                    <button class="opt-btns" id="Del">Del</button>
                    <button class="opt-btns" id="show">=</button>
                </div>
            </div>
        </div>
    </main>




    <!-- <script src="script.js"></script> -->
     <script src="app.js"></script>
</body>
</html>
