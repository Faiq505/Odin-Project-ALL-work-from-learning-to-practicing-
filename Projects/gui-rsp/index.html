<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scoreboard">
        <ul class="Players">
            <li class="human">Human : <span id="humanscore"></span> </li>
            <li class="comp">Computer : <span id="Computerscore"></span></li>
        </ul>
    </div>

    <div class="game">
        <div class="items" id="rock" >
                <img src="rock.jpg" alt="" >
        </div>
        <div class="items" id="paper">
            <img src="paper.jpg" alt="" >
        </div>
        <div class="items" id="scissor">
                <img src="scissors.jpg" alt="" >
        </div>
    </div>

    <div class="msg-box">
        <p id="msg">Make A Move</p>
    </div>



    <script src="script.js"></script>
</body>
</html>
