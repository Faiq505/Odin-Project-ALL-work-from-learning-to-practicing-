<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC-TAC-TOE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">
        <div class="title">
            <h3>TIC TAC TOE</h3>
        </div>

        <div class="reset">
            <p id="X" class="selector">X</p>
            <button id="btn">RESET</button>
            <p id="O" class="selector">O</p>
        </div>

        <div class="game">
            <button class="box 1"></button>
            <button class="box 2"></button>
            <button class="box 3"></button>
            <button class="box 4"></button>
            <button class="box 5"></button>
            <button class="box 6"></button>
            <button class="box 7"></button>
            <button class="box 8"></button>
            <button class="box 9"></button>
        </div>

        <div class="scoreboard">
            <p class="yourscore">Your Score :</p>
            <p class="computerscore">Computer Score :</p>
        </div>

    </div>



    <script src="script.js"></script>
</body>

</html>
