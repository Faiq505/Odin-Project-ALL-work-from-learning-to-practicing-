<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .main{
            display: flex;
            border:5px solid green;
            background-color: #76f176;
            height: 100vh;
            width: 100vw;
            align-items: center;
            flex-direction: column;
            justify-content: space-around;
            padding: 12px;
        }
        .blue{
            border:5px solid rgb(0, 58, 128);
            background-color: #76f1df;
            height:400px;
            width: 100%;
            margin: 12px;
            display: flex;
           
        }
        .peach{
            width:100%;
            height: 130px;
            background-color: rgb(236, 181, 93);
            margin: 5px;
            border:5px solid orange;
            

        }
    </style>
</head>
<body>
    <div class="main">
        <div class="blue">
            <div class="peach"></div>
            <div class="peach"></div>
            <div class="peach"></div>
        </div>
        <div class="blue">
            <div class="peach"></div>
            <div class="peach"></div>
        </div>
        <div class="blue">
            <div class="peach"></div>
            <div class="peach"></div>
            <div class="peach"></div>
            <div class="peach"></div>
        </div>
    </div>
</body>
</html>
