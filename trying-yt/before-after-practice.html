<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>before-after</title>
    <style>
        h1::before {
            content: '';
            display:block;
            background: orange;
            width: 100px;
            height: 100px;
        }
        h1::after {
            content: '';
            display:block;
            background: orange;
            width: 0px;
            height: 0px;
            left:0;
            bottom:0;
            transition: all ease 1.5s;
        }
        h1:hover::after{
            width: 173px;
            height: 10px;
        }

    </style>
</head>
<body>
    <h1>Hello World</h1>
</body>
</html>
